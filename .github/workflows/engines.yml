# Real runs of the synthetic data with each container engine and library mode, every executed command checked
# against the arguments of the reference run (tests/workflow/expected_args.tsv); and the SLURM executor on a
# one-machine SLURM set up for the job. Runs on every push.
name: engines
on: [push, pull_request]
env:
  MAX_CPUS: 4
  MAX_MEMORY: 14 GB
jobs:
  engines:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, apptainer]
        library: [fwd_umi, fwd_no_umi]
    steps:
      - uses: actions/checkout@v4
      - name: Unprivileged user namespaces allowed on this throwaway machine (Apptainer)
        if: matrix.engine == 'apptainer'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Apptainer
        if: matrix.engine == 'apptainer'
        uses: eWaterCycle/setup-apptainer@v3.0.0
        with: { apptainer-version: 1.4.5 }
      - name: Install
        run: bash install.sh --prefix "$RUNNER_TEMP/qc"
      - name: Run and check every command
        run: bash tests/workflow/test_commands.sh "$RUNNER_TEMP/qc" ${{ matrix.engine }} "$RUNNER_TEMP/w" ${{ matrix.library }}
      - name: Self-test on the public data, counts compared with those stored (written with udocker)
        run: '"$RUNNER_TEMP/qc/bin/quantseq-counts" test --engine ${{ matrix.engine }} --library ${{ matrix.library }} --workdir "$RUNNER_TEMP/st"'
      - name: Keep the run record if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: 'run-${{ matrix.engine }}-${{ matrix.library }}', path: '${{ runner.temp }}/w/out/run' }

  slurm:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: A one-machine SLURM, with accounting (slurmdbd on the runner's MySQL)
        run: |
          # Slurm 23.11 (Ubuntu 24.04) has no accounting_storage/none; without slurmdbd its association manager starts
          # from whatever errno is left over and then holds every job with InvalidAccount. slurmdbd is the setup
          # SchedMD supports, so the job builds one: MySQL is on the runner (root/root), stopped.
          sudo apt-get update -q && sudo apt-get install -y -q slurm-wlm slurmdbd munge
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE slurm_acct_db; CREATE USER 'slurm'@'localhost' IDENTIFIED BY 'ci';
            GRANT ALL ON slurm_acct_db.* TO 'slurm'@'localhost'; FLUSH PRIVILEGES;"
          H=$(hostname -s); C=$(nproc); M=$(( $(free -m | awk '/Mem:/ {print $2}') - 1024 ))
          sudo mkdir -p /etc/slurm /tmp/slurmd /var/spool/slurmctld /var/log/slurm
          printf '%s\n' "AuthType=auth/munge" "DbdHost=localhost" "SlurmUser=slurm" "StorageType=accounting_storage/mysql" \
            "StorageHost=localhost" "StorageUser=slurm" "StoragePass=ci" "StorageLoc=slurm_acct_db" \
            "LogFile=/var/log/slurm/slurmdbd.log" "PidFile=/run/slurmdbd.pid" | sudo tee /etc/slurm/slurmdbd.conf > /dev/null
          sudo chown slurm: /etc/slurm/slurmdbd.conf && sudo chmod 600 /etc/slurm/slurmdbd.conf
          printf '%s\n' "ClusterName=ci" "SlurmctldHost=$H" "AuthType=auth/munge" "ProctrackType=proctrack/linuxproc" \
            "SlurmdSpoolDir=/tmp/slurmd" "StateSaveLocation=/var/spool/slurmctld" "SelectType=select/cons_tres" \
            "SelectTypeParameters=CR_Core_Memory" "ReturnToService=2" \
            "SlurmctldLogFile=/var/log/slurm/slurmctld.log" "SlurmdLogFile=/var/log/slurm/slurmd.log" \
            "TaskPlugin=task/none" "JobAcctGatherType=jobacct_gather/none" "MpiDefault=none" "SlurmdUser=root" \
            "SlurmUser=slurm" "MailProg=/bin/true" \
            "AccountingStorageType=accounting_storage/slurmdbd" "AccountingStorageHost=localhost" \
            "SchedulerType=sched/builtin" "PriorityType=priority/basic" \
            "NodeName=$H CPUs=$C RealMemory=$M State=UNKNOWN" "PartitionName=debug Nodes=$H Default=YES MaxTime=INFINITE State=UP" \
            | sudo tee /etc/slurm/slurm.conf
          sudo chown slurm: /var/spool/slurmctld /var/log/slurm
          sudo systemctl start munge && sudo systemctl start slurmdbd
          for i in $(seq 30); do sacctmgr -n list cluster > /dev/null 2>&1 && break; sleep 2; done
          sudo sacctmgr -i add cluster ci && sudo sacctmgr -i add account ci Cluster=ci && sudo sacctmgr -i add user "$USER" Account=ci
          sudo systemctl start slurmctld && sudo systemctl start slurmd
          sleep 5 && sinfo && sacctmgr -n list assoc format=Cluster,Account,User
      - name: SLURM runs a job
        timeout-minutes: 3
        run: |
          id=$(sbatch --parsable --wrap 'hostname' -o /tmp/smoke.out)
          for i in $(seq 60); do squeue -h -j "$id" | grep -q . || break; sleep 2; done
          squeue -a; cat /tmp/smoke.out; [ -s /tmp/smoke.out ] || {
            sudo tail -n 30 /var/log/slurm/slurmctld.log; sudo tail -n 30 /var/log/slurm/slurmdbd.log; exit 1; }
      - name: Install
        run: bash install.sh --prefix "$RUNNER_TEMP/qc"
      - name: Run through SLURM and check every command
        timeout-minutes: 55
        run: bash tests/workflow/test_commands.sh "$RUNNER_TEMP/qc" docker "$RUNNER_TEMP/w" fwd_umi slurm
      - name: What SLURM and Nextflow were doing
        if: failure() || cancelled()
        run: |
          squeue -a || true; sacct -a --format=JobID,JobName%40,State,ExitCode,ReqMem,ReqCPUS,NodeList || true
          sinfo -R || true
          sudo tail -n 40 /var/log/slurm/slurmctld.log || true
          sudo tail -n 40 /var/log/slurm/slurmd.log || true
          tail -n 60 "$RUNNER_TEMP/w/out/run/nextflow.log" || true
          tail -n 60 "$RUNNER_TEMP/w/run.out" 2>/dev/null || true
          for f in "$RUNNER_TEMP"/w/out/work/*/*/.command.log; do echo "== $f"; tail -n 20 "$f"; done 2>/dev/null | head -n 80 || true
      - name: Keep the run record if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: run-slurm, path: '${{ runner.temp }}/w/out/run' }
