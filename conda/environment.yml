# The environment quantseq-counts runs in (the tools themselves run in pinned containers).
# install.sh uses the lock files made from this file: conda/conda-linux-64.lock (with udocker 1.3.9, which conda-forge
# builds for Linux only) and conda/conda-osx-arm64.lock (without it; a Mac runs the containers with Docker).
name: quantseq-counts
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pyyaml
  - pytest
  - openjdk=17
  - udocker=1.3.9  # linux-64 only
